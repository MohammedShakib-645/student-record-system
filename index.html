<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Record Management System</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>EduTrack</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="showSection('dashboard')">
        <i class="fas fa-chart-pie"></i> Dashboard
      </a>
      <a href="#" class="nav-item" onclick="showSection('students')">
        <i class="fas fa-users"></i> Students
      </a>
      <a href="#" class="nav-item" onclick="showSection('add')">
        <i class="fas fa-user-plus"></i> Add Student
      </a>
    </nav>
    <div class="sidebar-footer">
      <i class="fas fa-code"></i> Made by Mohammed Shakib
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="globalSearch" placeholder="Search students..." oninput="liveSearch()" />
        </div>
        <div class="avatar">MS</div>
      </div>
    </header>

    <!-- Dashboard Section -->
    <section id="section-dashboard" class="section active">
      <div class="stats-grid">
        <div class="stat-card purple">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-info">
            <h3 id="stat-total">0</h3>
            <p>Total Students</p>
          </div>
        </div>
        <div class="stat-card cyan">
          <div class="stat-icon"><i class="fas fa-star"></i></div>
          <div class="stat-info">
            <h3 id="stat-avg">0.00</h3>
            <p>Average CGPA</p>
          </div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon"><i class="fas fa-trophy"></i></div>
          <div class="stat-info">
            <h3 id="stat-top">0.00</h3>
            <p>Top CGPA</p>
          </div>
        </div>
        <div class="stat-card orange">
          <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-info">
            <h3 id="stat-low">0</h3>
            <p>Low CGPA (&lt;6)</p>
          </div>
        </div>
      </div>

      <!-- Recent Students -->
      <div class="card">
        <div class="card-header">
          <h2><i class="fas fa-clock"></i> Recent Students</h2>
          <button class="btn-sm" onclick="showSection('students')">View All</button>
        </div>
        <div id="recentList" class="student-cards"></div>
        <p id="dashEmpty" class="empty-msg" style="display:none">No students added yet. <a href="#" onclick="showSection('add')">Add one!</a></p>
      </div>
    </section>

    <!-- Students Section -->
    <section id="section-students" class="section">
      <div class="card">
        <div class="card-header">
          <h2><i class="fas fa-users"></i> All Students</h2>
          <button class="btn-primary" onclick="showSection('add')">
            <i class="fas fa-plus"></i> Add New
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Branch</th>
                <th>Year</th>
                <th>CGPA</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentTable"></tbody>
          </table>
          <p id="tableEmpty" class="empty-msg" style="display:none">No students found.</p>
        </div>
      </div>
    </section>

    <!-- Add Student Section -->
    <section id="section-add" class="section">
      <div class="card form-card">
        <div class="card-header">
          <h2 id="formHeading"><i class="fas fa-user-plus"></i> Add New Student</h2>
        </div>
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="form-group">
            <label>Student ID</label>
            <input type="number" id="sId" placeholder="e.g. 101" />
          </div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="sName" placeholder="e.g. John Doe" />
          </div>
          <div class="form-group">
            <label>Branch</label>
            <select id="sBranch">
              <option value="">Select Branch</option>
              <option>CSE</option>
              <option>CSE (AI & ML)</option>
              <option>ECE</option>
              <option>EEE</option>
              <option>Mechanical</option>
              <option>Civil</option>
              <option>IT</option>
            </select>
          </div>
          <div class="form-group">
            <label>Year</label>
            <select id="sYear">
              <option value="">Select Year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>
          <div class="form-group">
            <label>CGPA</label>
            <input type="number" id="sCgpa" placeholder="e.g. 8.5" step="0.01" min="0" max="10" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="sEmail" placeholder="e.g. john@college.com" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="saveStudent()">
            <i class="fas fa-save"></i> <span id="saveBtnText">Save Student</span>
          </button>
          <button class="btn-ghost" onclick="clearForm()">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="script.js?v=2"></script>
</body>
</html>
