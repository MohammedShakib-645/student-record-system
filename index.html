<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Record Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>📚 Student Record Management System</h1>

    <!-- Form -->
    <div class="form-box">
      <h2 id="formTitle">Add Student</h2>
      <input type="hidden" id="editId" />

      <div class="form-row">
        <input type="number" id="studentId" placeholder="Student ID" />
        <input type="text" id="studentName" placeholder="Full Name" />
      </div>
      <div class="form-row">
        <input type="text" id="studentBranch" placeholder="Branch (e.g. CSE)" />
        <input type="number" id="studentYear" placeholder="Year (1-4)" min="1" max="4" />
      </div>
      <div class="form-row">
        <input type="number" id="studentCgpa" placeholder="CGPA (0-10)" step="0.01" min="0" max="10" />
        <input type="text" id="searchBox" placeholder="🔍 Search by name or ID..." oninput="searchStudents()" />
      </div>

      <div class="btn-row">
        <button onclick="saveStudent()" class="btn-add">Add Student</button>
        <button onclick="clearForm()" class="btn-clear">Clear</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span id="totalCount">0</span>
        <p>Total Students</p>
      </div>
      <div class="stat-card">
        <span id="avgCgpa">0.00</span>
        <p>Average CGPA</p>
      </div>
      <div class="stat-card">
        <span id="topCgpa">0.00</span>
        <p>Top CGPA</p>
      </div>
    </div>

    <!-- Table -->
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Year</th>
            <th>CGPA</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTable">
          <!-- rows go here -->
        </tbody>
      </table>
      <p id="noRecords" class="no-records">No students added yet.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
